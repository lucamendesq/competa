packages:
  - "apps/*"
  - "libs/*"
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  nx: true
minimumReleaseAgeExclude:
  - '@inquirer/checkbox@5.2.3'
  - '@inquirer/confirm@6.3.0'
  - '@inquirer/core@12.0.1'
  - '@inquirer/editor@5.3.1'
  - '@inquirer/expand@5.1.3'
  - '@inquirer/input@5.1.4'
  - '@inquirer/number@4.2.1'
  - '@inquirer/password@5.2.0'
  - '@inquirer/prompts@8.7.0'
  - '@inquirer/rawlist@5.3.3'
  - '@inquirer/search@4.3.1'
  - '@inquirer/select@5.2.3'
  - '@inquirer/type@4.1.0'
  - '@nestjs/cli@12.0.0'
  - '@nestjs/common@12.0.1'
  - '@nestjs/core@12.0.1'
  - '@nestjs/observe@0.1.8'
  - '@nestjs/platform-express@12.0.1'
  - '@nestjs/schematics@12.0.0'
  - '@nestjs/testing@12.0.1'
  - '@nx/nx-darwin-arm64@23.1.2'
  - '@nx/nx-darwin-x64@23.1.2'
  - '@nx/nx-freebsd-x64@23.1.2'
  - '@nx/nx-linux-arm-gnueabihf@23.1.2'
  - '@nx/nx-linux-arm64-gnu@23.1.2'
  - '@nx/nx-linux-arm64-musl@23.1.2'
  - '@nx/nx-linux-x64-gnu@23.1.2'
  - '@nx/nx-linux-x64-musl@23.1.2'
  - '@nx/nx-win32-arm64-msvc@23.1.2'
  - '@nx/nx-win32-x64-msvc@23.1.2'
  - nx@23.1.2
