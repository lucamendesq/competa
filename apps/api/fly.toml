app = "competa-api"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "sh -c 'node_modules/.bin/drizzle-kit migrate && node_modules/.bin/tsx src/infra/database/seeds/index.ts'"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  BETTER_AUTH_URL = "https://api.competa.com.br"
  WEB_URL = "https://app.competa.com.br"
  EMAIL_FROM = "nao-responda@competa.com.br"

# Sem esta seção a máquina sobe com o default de 256 MB, e o RSS-base do node já encosta no
# limite: o hash de senha (scrypt do better-auth) de 3–4 logins em paralelo, até com senha
# errada, levava o processo ao OOM kill (exit 137) e a API ficava fora 1–2 min. Staging e
# produção usam a mesma VM.
[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  # As varreduras de prazo (7h) e de lembrete (9h) rodam DENTRO deste processo. Com zero, a
  # máquina dorme de madrugada e a cobrança automática — que é o produto — simplesmente não
  # acontece naquele dia, sem erro nenhum no log.
  min_machines_running = 1

  [[http_service.checks]]
    path = "/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
