services:
  db:
    image: postgres:17
    command: ['postgres', '-c', 'timezone=UTC']
    ports:
      - ${DB_PORT:-5432}:5432
    environment:
      - POSTGRES_USER=competa_api
      - POSTGRES_DB=competa
      - POSTGRES_HOST_AUTH_METHOD=trust
      - TZ=UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
      # cria `competa_test` no primeiro start, para a suíte de integração (vitest)
      # rodar sem passo manual — só roda em volume novo, apague `pgdata` se já subiu antes.
      - ./docker/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U competa_api -d competa']
      interval: 5s
      timeout: 3s
      retries: 10

  # sobe a imagem de produção (mesmo Dockerfile do deploy) contra o Postgres acima —
  # smoke test local antes de fazer `flyctl deploy`. `docker compose up api`.
  # NODE_ENV=development de propósito: testa se a IMAGEM sobe, não credenciais reais de
  # R2/Resend/TLS — Postgres do compose não fala TLS, e produção exigiria os três.
  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - ${PORT:-3000}:3000
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=competa_api
      - DB_NAME=competa
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL}
      - WEB_URL=${WEB_URL}

volumes:
  pgdata:
    driver: local
