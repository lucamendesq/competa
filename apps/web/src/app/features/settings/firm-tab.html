<section class="bg-card border-border max-w-2xl rounded-xl border">
  <div class="border-border border-b p-4">
    <h2 class="text-sm font-semibold">Contabilidade</h2>
    <p class="text-muted-foreground mt-1 text-xs">Dados do escritório e da sua conta.</p>
  </div>

  <div class="p-4">
    <label hlmLabel for="firm-name">Nome da contabilidade</label>
    <div class="mt-1.5 flex flex-wrap gap-2">
      <input
        hlmInput
        id="firm-name"
        class="flex-1"
        [ngModel]="name()"
        (ngModelChange)="name.set($event)"
        [disabled]="!isOwner()"
      />
      @if (isOwner()) {
        <button
          hlmBtn
          type="button"
          [disabled]="saving() || !name().trim() || name().trim() === firm.value()?.name"
          (click)="save()"
        >
          {{ saving() ? 'Salvando…' : 'Salvar' }}
        </button>
      }
    </div>
    <p class="text-muted-foreground mt-2 text-xs">
      É o nome que o Responsável vê nos e-mails e nas telas de envio.
      @if (!isOwner()) {
        Só o dono da contabilidade pode alterá-lo.
      }
    </p>
  </div>

  <dl class="divide-border border-border divide-y border-t">
    <div class="flex flex-wrap items-center justify-between gap-2 p-4">
      <dt class="text-muted-foreground text-xs">Seu nome</dt>
      <dd class="text-sm">{{ accountantName() }}</dd>
    </div>
    <div class="flex flex-wrap items-center justify-between gap-2 p-4">
      <dt class="text-muted-foreground text-xs">Seu e-mail</dt>
      <dd class="text-sm">{{ accountantEmail() }}</dd>
    </div>
  </dl>
</section>
